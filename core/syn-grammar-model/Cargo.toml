[package]
name = "syn-grammar-model"
version = "0.9.0"
edition = "2021"
# Mindest-Toolchain. Ab 1.88 liefert `Span::start()` auch im Prozedurmakro auf
# stable echte Positionen (proc-macro2 setzt dort `proc_macro_span_location`).
# Darunter sind alle Spans (0,0), und die Adjazenzpruefung mehrzeichiger
# Operatoren im erzeugten Code waere wirkungslos.
rust-version = "1.88"
description = "Internal model and parser for syn-grammar."
license = "MIT OR Apache-2.0"
repository = "https://github.com/keywan-ghadami/syn-grammar"

[lib]
path = "src/syn_grammar_model.rs"

[dependencies]
syn = { version = "2.0", features = ["full", "extra-traits", "visit"] }
quote = "1.0"
proc-macro2 = { version = "1.0", features = ["span-locations"] }
