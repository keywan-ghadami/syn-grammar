[package]
name = "grammar-kit-macros"
version = "0.9.0"
edition = "2021"
description = "Ableitungsmakros fuer grammar-kit (`with_span`)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/keywan-ghadami/syn-grammar"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full", "derive"] }
