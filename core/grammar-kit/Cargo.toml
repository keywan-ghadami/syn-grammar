[package]
name = "grammar-kit"
version = "0.9.0"
edition = "2021"
# Minimum toolchain. From 1.88 on, `Span::start()` returns real positions even
# inside a procedural macro on stable (proc-macro2 sets `proc_macro_span_location`
# there). Below that, all spans are (0,0) and the adjacency check for
# multi-character operators in the generated code would be ineffective.
rust-version = "1.88"
description = "Testing and runtime utilities for syn-grammar generated parsers."
license = "MIT OR Apache-2.0"
repository = "https://github.com/keywan-ghadami/syn-grammar"

[lib]
path = "src/grammar_kit.rs"

[features]
default = ["syn", "testing"]
syn = ["dep:syn", "dep:proc-macro2"]
testing = ["dep:termcolor"]

[dependencies]
syn = { version = "2.0", features = ["full", "extra-traits"], optional = true }
proc-macro2 = { version = "1.0", optional = true, features = ["span-locations"] }
termcolor = { version = "1.2", optional = true }
paste = "1.0"
grammar-kit-macros = { path = "../grammar-kit-macros", version = "0.9.0" }

[dev-dependencies]
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
