# Helper crate for the trybuild case on the REAL procedural-macro path.
#
# It is a workspace member but deliberately not a default member (see the
# root Cargo.toml for why `exclude` does not work) and is pulled in only as a
# path dev-dependency of `syn-grammar`. So the everyday `cargo build`/`cargo
# test` does not build test artifacts, yet trybuild still finds it: it adopts
# the dev-dependencies of the crate under test into its scratch project.
[package]
name = "ui-macro"
version = "0.0.0"
edition = "2021"
# Minimum toolchain. From 1.88 on, `Span::start()` returns real positions even
# inside a procedural macro on stable (proc-macro2 sets `proc_macro_span_location`
# there). Below that, all spans are (0,0) and the adjacency check for
# multi-character operators in the generated code would be ineffective.
rust-version = "1.88"
publish = false

[lib]
proc-macro = true

[dependencies]
syn-grammar = { path = "../.." }
syn = { version = "2.0", features = ["full", "extra-traits"] }
proc-macro2 = "1.0"
