[package]
name = "syn-grammar-macros"
version = "0.9.0"
edition = "2021"
# Minimum toolchain. From 1.88 on, `Span::start()` returns real positions even
# inside a procedural macro on stable (proc-macro2 sets `proc_macro_span_location`
# there). Below that, all spans are (0,0) and the adjacency check for
# multi-character operators in the generated code would be ineffective.
rust-version = "1.88"
description = "Internal macros for syn-grammar."
license = "MIT OR Apache-2.0"
repository = "https://github.com/keywan-ghadami/syn-grammar"

[lib]
proc-macro = true
path = "src/syn_grammar_macros.rs"

[dependencies]
syn = { version = "2.0", features = ["full", "extra-traits", "visit-mut"] }
quote = "1.0"
proc-macro2 = "1.0"
syn-grammar-model = { path = "../../core/syn-grammar-model", version = "0.9.0" }
