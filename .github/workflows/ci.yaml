name: Rust CI

on:
  # Deliberately without a branch filter: the list used to be ["main",
  # "logic-changes"], so no CI ran at all on any other working branch -
  # failures only surfaced in the pull request.
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Pinned, not `stable`. `-D warnings` on a moving toolchain means the CI
      # can turn red without a single line changing - as soon as a Rust
      # release adds a lint. Exactly that has happened before
      # (clippy::collapsible_match).
      #
      # New lints are not lost: the `lint-preview` job below runs on `stable`
      # and reports them without blocking. This version may be raised at any
      # time once the preview is green.
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt

      - name: Cache Cargo Registry
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Linting (Clippy)
        # --all-targets also covers tests, examples and benches. Without it,
        # Clippy only ran over lib and bins - exactly where the warnings were NOT.
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --verbose

      - name: Run Tests
        # Runs doc tests and integration tests as well
        run: cargo test --workspace --verbose

      - name: Check Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --document-private-items

  msrv:
    name: Minimum toolchain (MSRV)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # The `rust-version` declared in the Cargo.toml files is a promise to
      # users: cargo aborts below it with a clear message. To keep that promise
      # true, the workspace is built here against exactly that toolchain -
      # otherwise a newer language feature slips in unnoticed.
      #
      # 1.88 is not chosen arbitrarily: from there on, `Span::start()` returns
      # real positions inside a procedural macro on stable (proc-macro2 then
      # sets `proc_macro_span_location`). Below that, all spans are (0,0).
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache Cargo Registry
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      - name: Build
        run: cargo build --workspace --verbose

      - name: Run Tests
        run: cargo test --workspace --verbose

  lint-preview:
    name: Lint preview (stable, non-blocking)
    runs-on: ubuntu-latest
    # Reports lints of a newer toolchain before raising the pinned version
    # becomes due. A failure here is an early warning, not a stop.
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo Registry
        uses: Swatinem/rust-cache@v2
        with:
          key: lint-preview

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Linting (Clippy)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --document-private-items
