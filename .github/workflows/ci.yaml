name: Rust CI

on:
  push:
    branches: ["main", "logic-changes"]
  pull_request:
    branches: ["main", "logic-changes"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo Registry
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Linting (Clippy)
        # --all-targets deckt auch Tests, Beispiele und Benches ab. Ohne das lief
        # Clippy nur ueber lib und bins - genau dort, wo die Warnungen NICHT waren.
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --verbose

      - name: Run Tests
        # Runs doc tests and integration tests as well
        run: cargo test --workspace --verbose

      - name: Check Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --document-private-items

  msrv:
    name: Mindest-Toolchain (MSRV)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Die in den Cargo.toml deklarierte `rust-version` ist eine Zusage an
      # Nutzer: cargo bricht darunter mit klarer Meldung ab. Damit die Zusage
      # auch stimmt, wird sie hier gegen genau diese Toolchain gebaut - sonst
      # rutscht unbemerkt ein neueres Sprachmittel hinein.
      #
      # 1.88 ist nicht frei gewaehlt: ab dort liefert `Span::start()` auch im
      # Prozedurmakro auf stable echte Positionen (proc-macro2 setzt dann
      # `proc_macro_span_location`). Darunter sind alle Spans (0,0).
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache Cargo Registry
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      - name: Build
        run: cargo build --workspace --verbose

      - name: Run Tests
        run: cargo test --workspace --verbose
