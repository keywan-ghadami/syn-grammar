[workspace]
members = [
    "syn-grammar",
    "syn-grammar/syn-grammar-macros",
    "core/syn-grammar-model",
    "core/grammar-kit",
    "core/grammar-kit-macros",
    "cxx-parser",
    # Helper crate for the trybuild case on the real procedural-macro path.
    # It MUST be a member: cargo automatically turns every path dependency of
    # a member into a member itself, and a separate `[workspace]` next to it
    # fails with "multiple workspace roots found in the same workspace".
    # `exclude` does not help against that. Via `default-members` it at least
    # stays out of the everyday `cargo build`/`cargo test`.
    "syn-grammar/tests/ui-macro",
]
default-members = [
    "syn-grammar",
    "syn-grammar/syn-grammar-macros",
    "core/syn-grammar-model",
    "core/grammar-kit",
    "core/grammar-kit-macros",
    "cxx-parser",
]
resolver = "2"
