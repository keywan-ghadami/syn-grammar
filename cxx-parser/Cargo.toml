[package]
name = "cxx-parser"
version = "0.1.0"
edition = "2021"
# Mindest-Toolchain. Ab 1.88 liefert `Span::start()` auch im Prozedurmakro auf
# stable echte Positionen (proc-macro2 setzt dort `proc_macro_span_location`).
# Darunter sind alle Spans (0,0), und die Adjazenzpruefung mehrzeichiger
# Operatoren im erzeugten Code waere wirkungslos.
rust-version = "1.88"

[dependencies]
syn = { version = "2.0", features = ["full", "extra-traits"] }
syn-grammar = { path = "../syn-grammar" }
quote = "1.0"
proc-macro2 = "1.0"

[lib]
proc-macro = false
path = "src/cxx_parser.rs"
